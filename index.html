<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arbeitszeit</title>
<meta name="description" content="Arbeitszeitrechner mit gesetzlicher Pausenlogik">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arbeitszeit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F2F2F7" id="themeColor">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="favicon.png?v=2">
<script>
  try {
    var t = localStorage.getItem('arbeitszeit.theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --input: #FFFFFF;
    --fill: rgba(118,118,128,.14);
    --fill-2: rgba(118,118,128,.075);
    --text: #1C1C1E;
    --text-2: rgba(60,60,67,.64);
    --text-3: rgba(60,60,67,.34);
    --sep: rgba(60,60,67,.13);
    --accent: #5856D6;
    --accent-soft: rgba(88,86,214,.11);
    --pause: #FF9500;
    --pause-text: #B25B00;
    --pause-soft: rgba(255,149,0,.12);
    --ok: #34C759;
    --ok-text: #1F7A35;
    --ok-soft: rgba(52,199,89,.13);
    --danger: #FF3B30;
    --danger-text: #D70015;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 28px rgba(0,0,0,.05);
    --input-ring: 0 0 0 .5px rgba(60,60,67,.16), 0 1px 2px rgba(0,0,0,.03);
    --glass-hi: rgba(255,255,255,.34);
    --glass-lo: rgba(236,236,244,.14);
    --glass-edge: inset 0 1px 1px rgba(255,255,255,.9), inset 0 -1px 1px rgba(255,255,255,.3), inset 0 0 0 1px rgba(255,255,255,.45), 0 0 0 .5px rgba(0,0,0,.07);
    --glass-band: rgba(118,118,128,.16);
    --glass-btn: rgba(255,255,255,.55);
  }
  /* Standard ist hell – dunkel nur, wenn per Schalter gewählt */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #000000;
    --card: #1C1C1E;
    --input: #2C2C2E;
    --fill: rgba(118,118,128,.26);
    --fill-2: rgba(118,118,128,.14);
    --text: #F5F5F7;
    --text-2: rgba(235,235,245,.62);
    --text-3: rgba(235,235,245,.3);
    --sep: rgba(84,84,88,.55);
    --accent: #8E8CFF;
    --accent-soft: rgba(142,140,255,.17);
    --pause: #FF9F0A;
    --pause-text: #FFB340;
    --pause-soft: rgba(255,159,10,.15);
    --ok: #30D158;
    --ok-text: #4CD964;
    --ok-soft: rgba(48,209,88,.15);
    --danger: #FF453A;
    --danger-text: #FF6961;
    --shadow: 0 0 0 .5px rgba(255,255,255,.05);
    --input-ring: 0 0 0 .5px rgba(255,255,255,.06);
    --glass-hi: rgba(70,70,76,.5);
    --glass-lo: rgba(30,30,34,.36);
    --glass-edge: inset 0 1px 1px rgba(255,255,255,.2), inset 0 -1px 1px rgba(255,255,255,.06), inset 0 0 0 1px rgba(255,255,255,.08), 0 0 0 .5px rgba(0,0,0,.6);
    --glass-band: rgba(118,118,128,.3);
    --glass-btn: rgba(255,255,255,.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
    min-height: 100dvh;
    transition: background-color .3s ease, color .3s ease;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app {
    max-width: 520px;
    margin: 0 auto;
    padding:
      calc(env(safe-area-inset-top) + 14px)
      max(16px, env(safe-area-inset-right))
      calc(env(safe-area-inset-bottom) + 40px)
      max(16px, env(safe-area-inset-left));
  }

  /* Header */
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 10px 4px 18px; }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; text-wrap: balance; animation: fade .6s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center; flex: none;
    background: var(--fill-2); color: var(--text-2);
    transition: transform .15s ease, background-color .2s ease, color .2s ease;
  }
  .icon-btn:hover { color: var(--text); background: var(--fill); }
  .icon-btn:active { transform: scale(.9); }
  .icon-btn svg { width: 19px; height: 19px; }
  .i-sun { display: none; }
  :root[data-theme="dark"] .i-sun { display: block; }
  :root[data-theme="dark"] .i-moon { display: none; }

  .card { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); transition: background-color .3s ease; }

  /* Ergebnis */
  .hero { padding: 20px 18px 18px; margin-bottom: 26px; }
  .hero-label { font-size: 13px; font-weight: 600; color: var(--text-2); }
  .hero-value { font-size: 56px; font-weight: 700; letter-spacing: -.035em; line-height: 1.02; margin-top: 6px; font-variant-numeric: tabular-nums; transition: color .2s ease; }
  .hero-value .unit { font-size: 22px; font-weight: 600; color: var(--text-2); margin-left: 5px; letter-spacing: 0; }
  .hero.empty .hero-value, .hero.error .hero-value { color: var(--text-3); }
  .hero-sub { font-size: 14px; color: var(--text-2); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .hero-sub:empty { display: none; }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1.22fr; gap: 6px; margin-top: 18px; }
  .stat { background: var(--fill-2); border-radius: 12px; padding: 10px 10px 9px; min-width: 0; }
  .stat-l { display: block; font-size: 12px; font-weight: 500; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat-v { display: block; font-size: 16px; font-weight: 600; margin-top: 1px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat-v.pause { color: var(--pause-text); }
  .stat-v.ok { color: var(--ok-text); }

  .pbox { margin-top: 8px; border-radius: 12px; padding: 9px 12px 10px; background: var(--pause-soft); }
  .pbox.done { background: var(--ok-soft); }
  .pbox.off { background: var(--fill-2); }
  .pbox-head { display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 600; }
  .pbar { flex: 1; height: 6px; border-radius: 99px; background: var(--fill); display: flex; overflow: hidden; }
  .plegend { display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 6px; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .plegend span { display: inline-flex; align-items: center; gap: 5px; }
  .plegend i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .plegend i.ok { background: var(--ok); }
  .plegend i.cut { background: var(--pause); }
  .plegend i.open { background: repeating-linear-gradient(135deg, var(--pause) 0 2px, transparent 2px 4px); box-shadow: inset 0 0 0 1px var(--pause); }
  .pbar i { display: block; height: 100%; transition: width .45s cubic-bezier(.2,.8,.2,1); }
  .pbar i.ok { background: var(--ok); }
  .pbar i.cut { background: var(--pause); }
  .pbar i.open { background: repeating-linear-gradient(135deg, var(--pause) 0 3px, transparent 3px 6px); }
  .note { font-size: 13px; color: var(--text-2); line-height: 1.42; margin-top: 12px; padding: 0 2px; }
  .note.err { color: var(--danger-text); font-weight: 500; }

  /* Zeiten */
  .section-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 8px; }
  .section-label { font-size: 13px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
  .text-btn { font-size: 15px; font-weight: 500; color: var(--accent); padding: 2px 0; }
  .text-btn:active { opacity: .6; }

  .entry { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 14px; transition: background-color .3s ease, box-shadow .2s ease; }
  .entry.invalid { box-shadow: inset 0 0 0 1.5px var(--danger); }
  .entry.enter { animation: pop .34s cubic-bezier(.2,.8,.2,1); }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.985); } to { opacity: 1; transform: none; } }
  .entry-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; min-height: 28px; }
  .entry-title { flex: 1; font-size: 12px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: .05em; padding-left: 2px; }
  .entry-dur { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .del { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--text-3); transition: color .15s ease, background-color .15s ease; }
  .del:hover { color: var(--danger-text); background: var(--fill); }
  .del svg { width: 16px; height: 16px; }
  .entry-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fcol { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .lbl { font-size: 12px; font-weight: 600; color: var(--text-2); padding-left: 2px; }
  .tbtn {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; min-width: 0; height: 48px;
    padding: 0 14px; border-radius: 12px;
    background: var(--fill-2); color: var(--text);
    font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; text-align: left;
    transition: background-color .3s ease, box-shadow .2s ease, transform .15s ease;
  }
  .tbtn:active { transform: scale(.98); }
  .tbtn.empty .tval { color: var(--text-3); }
  .tbtn.active { background: var(--accent-soft); }
  .tbtn.active .tval, .tbtn.active svg { color: var(--accent); }
  .tbtn svg { width: 18px; height: 18px; color: var(--text-3); flex: none; }
  .entry-msg { font-size: 13px; margin-top: 9px; padding-left: 2px; color: var(--text-2); }
  .entry-msg:empty { display: none; }
  .entry-msg.err { color: var(--danger-text); }

  /* Überstunden-Ziel: nötiges Ende berechnen, solange das Ende noch offen ist */
  .goal-btn {
    width: 100%; margin-top: 10px; height: 44px; border-radius: 12px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 15px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    transition: transform .15s ease;
  }
  .goal-btn:active { transform: scale(.985); }
  .goal-btn svg { width: 17px; height: 17px; }
  .goal-box { margin-top: 10px; border-radius: 14px; padding: 10px 12px 12px; background: var(--accent-soft); animation: fade .3s ease both; }
  .goal-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .goal-chip {
    display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 8px 0 12px; border-radius: 999px;
    background: var(--card); color: var(--accent); font-size: 13px; font-weight: 600;
    box-shadow: var(--input-ring); white-space: nowrap;
  }
  .goal-chip svg { width: 14px; height: 14px; }
  .goal-clear { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--text-2); flex: none; }
  .goal-clear svg { width: 14px; height: 14px; }
  .goal-main { display: flex; align-items: baseline; gap: 6px; margin-top: 10px; font-size: 15px; color: var(--text-2); padding-left: 2px; }
  .goal-main strong { font-size: 30px; font-weight: 700; letter-spacing: -.025em; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .goal-sub { font-size: 13px; color: var(--text-2); margin-top: 2px; padding-left: 2px; font-variant-numeric: tabular-nums; }
  .goal-note { font-size: 14px; line-height: 1.4; margin-top: 10px; padding-left: 2px; }
  .goal-note.err { color: var(--danger-text); }
  .goal-apply {
    width: 100%; margin-top: 12px; height: 42px; border-radius: 12px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
    transition: transform .15s ease;
  }
  .goal-apply:active { transform: scale(.985); }

  /* Uhrzeit-Rad: schwebendes Glas-Panel unten – in Daumenreichweite */
  .pop-catch { position: fixed; inset: 0; z-index: 30; display: none; touch-action: none; }
  .pop-catch.show { display: block; }
  .pop {
    position: fixed; z-index: 31; left: 50%;
    bottom: calc(env(safe-area-inset-bottom) + 10px);
    width: min(400px, calc(100% - 20px));
    padding: 10px 12px 8px; border-radius: 34px;
    background: linear-gradient(160deg, var(--glass-hi), var(--glass-lo));
    -webkit-backdrop-filter: blur(14px) saturate(210%);
    backdrop-filter: blur(14px) saturate(210%);
    box-shadow: var(--glass-edge), 0 24px 60px rgba(0,0,0,.16), 0 4px 16px rgba(0,0,0,.05);
    opacity: 0; transform: translate(-50%, calc(100% + 40px)) scale(.96);
    visibility: hidden; pointer-events: none;
    transition: transform .36s cubic-bezier(.3,.9,.3,1), opacity .22s ease, visibility 0s linear .36s;
  }
  .pop.show {
    opacity: 1; transform: translate(-50%, 0); visibility: visible; pointer-events: auto;
    transition: transform .52s cubic-bezier(.2,1.15,.32,1), opacity .18s ease, visibility 0s;
  }
  .app.picking { padding-bottom: 380px; }
  .pop-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 40px; }
  .pop-title { display: flex; flex-direction: column; align-items: center; line-height: 1.2; min-width: 0; }
  .pop-title strong { font-size: 16px; font-weight: 600; }
  .pop-hint { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pop-hint:empty { display: none; }
  .pop-btn {
    min-width: 76px; height: 36px; padding: 0 14px; border-radius: 999px;
    font-size: 15px; font-weight: 600; color: var(--text);
    background: var(--glass-btn);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.5), 0 0 0 .5px rgba(0,0,0,.06);
    transition: transform .15s ease;
  }
  .pop-btn:active { transform: scale(.94); }
  .pop-btn.tint { background: var(--accent); color: #fff; box-shadow: inset 0 1px 1px rgba(255,255,255,.35), 0 4px 12px rgba(88,86,214,.3); }
  .wheels { position: relative; display: flex; justify-content: center; align-items: center; gap: 0; height: 200px; margin-top: 4px; }
  .wheel-band { position: absolute; left: 6px; right: 6px; top: 80px; height: 40px; border-radius: 14px; background: var(--glass-band); pointer-events: none; }
  .wheel {
    position: relative; width: 96px; height: 200px;
    overflow-y: scroll; scroll-snap-type: y mandatory; overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch; scrollbar-width: none; outline: none;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, rgba(0,0,0,.35) 18%, #000 40%, #000 60%, rgba(0,0,0,.35) 82%, transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0, rgba(0,0,0,.35) 18%, #000 40%, #000 60%, rgba(0,0,0,.35) 82%, transparent 100%);
  }
  .wheel::-webkit-scrollbar { display: none; }
  .wpad { height: 80px; }
  .witem {
    height: 40px; line-height: 40px; text-align: center; cursor: pointer;
    font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums;
    scroll-snap-align: center; user-select: none; -webkit-user-select: none;
  }
  .colon { position: relative; font-size: 22px; font-weight: 600; padding-bottom: 2px; }
  /* Ziel-Modus: ein breites Rad statt Stunde/Minute */
  #wheelG { width: 260px; display: none; }
  .pop.goal #wheelG { display: block; }
  .pop.goal #wheelH, .pop.goal #wheelM, .pop.goal .colon { display: none; }
  .pop.goal #popNow { visibility: hidden; }

  /* Spruch */
  .quote {
    display: block; width: 100%; margin-top: 30px; padding: 6px 20px;
    font-size: 14px; line-height: 1.5; color: var(--text-2); text-align: center; text-wrap: balance;
    animation: fade .8s .2s ease both;
  }
  .quote.swap { animation: fade .5s ease both; }

  .gap { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 6px; font-size: 13px; color: var(--text-2); flex-wrap: wrap; min-height: 12px; }
  .gap svg { width: 14px; height: 14px; flex: none; }
  .gap b { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .tag { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--fill); color: var(--text-2); }
  .tag.ok { background: var(--ok-soft); color: var(--ok-text); }
  .tag.warn { background: var(--pause-soft); color: var(--pause-text); }
  .tag.err { background: rgba(255,59,48,.12); color: var(--danger-text); }
  .gap.err { color: var(--danger-text); }
  .gap.err b { color: var(--danger-text); }

  .add-line {
    width: 100%; margin-top: 12px; height: 48px; border-radius: 14px;
    border: 1.5px dashed var(--accent-soft);
    border-color: color-mix(in srgb, var(--accent) 38%, transparent);
    color: var(--accent); font-size: 15px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: background-color .15s ease, transform .15s ease;
  }
  .add-line:hover { background: var(--accent-soft); }
  .add-line:active { transform: scale(.985); }
  .add-line svg { width: 15px; height: 15px; }

  /* Schalter */
  .setting { margin-top: 18px; padding: 8px 10px 8px 16px; border-radius: 14px; background: var(--fill-2); }
  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; cursor: pointer; }
  .switch-title { font-size: 15px; font-weight: 500; color: var(--text-2); }
  .switch {
    -webkit-appearance: none; appearance: none;
    width: 51px; height: 31px; border-radius: 999px; flex: none;
    background: var(--fill); position: relative; cursor: pointer;
    transition: background-color .25s ease;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 27px; height: 27px; border-radius: 50%; background: #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16);
    transition: transform .28s cubic-bezier(.3,.7,.4,1.1);
  }
  .switch:checked { background: var(--ok); }
  .switch:checked::after { transform: translateX(20px); }

  @media (min-width: 600px) {
    .app { padding-top: calc(env(safe-area-inset-top) + 36px); }
    .hero { padding: 24px 24px 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 id="greeting">Hallo</h1>
    <button class="icon-btn" id="themeBtn" aria-label="Darstellung wechseln">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
    </button>
  </header>

  <section class="card hero" id="hero" aria-live="polite">
    <div class="hero-label">Netto-Arbeitszeit</div>
    <div class="hero-value"><span id="hNet">0:00</span><span class="unit">h</span></div>
    <div class="hero-sub" id="hSub"></div>
    <div class="stats">
      <div class="stat"><span class="stat-l">Brutto</span><span class="stat-v" id="hGross">0:00 h</span></div>
      <div class="stat"><span class="stat-l">Pause</span><span class="stat-v" id="hCut">–</span></div>
      <div class="stat"><span class="stat-l" id="hOverL">Überstunden</span><span class="stat-v" id="hOver">–</span></div>
    </div>
    <div id="pauseInfo"></div>
  </section>

  <div class="section-head">
    <span class="section-label">Zeiten</span>
    <button class="text-btn" id="resetBtn">Zurücksetzen</button>
  </div>
  <section id="entries"></section>
  <button class="add-line" id="addBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Weitere Arbeitszeit
  </button>

  <button class="quote" id="quote" aria-label="Neuer Spruch"></button>

  <section class="setting">
    <label class="switch-row">
      <span class="switch-title">Pausenzeiten einberechnen</span>
      <input type="checkbox" class="switch" id="autoBreak" checked>
    </label>
  </section>
</div>

<div class="pop-catch" id="popCatch"></div>
<div class="pop" id="pop" role="dialog" aria-labelledby="popTitle">
  <div class="pop-head">
    <button class="pop-btn" id="popNow">Jetzt</button>
    <div class="pop-title"><strong id="popTitle">Beginn</strong><span class="pop-hint" id="popHint"></span></div>
    <button class="pop-btn tint" id="popDone">Fertig</button>
  </div>
  <div class="wheels">
    <div class="wheel-band"></div>
    <div class="wheel" id="wheelH" tabindex="0" aria-label="Stunde"></div>
    <span class="colon">:</span>
    <div class="wheel" id="wheelM" tabindex="0" aria-label="Minute"></div>
    <div class="wheel" id="wheelG" tabindex="0" aria-label="Überstunden-Ziel"></div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const BREAK_MIN = 30;   // gesetzliche Ruhepause (Maximum, keine 45-Min-Stufe)
  const THRESHOLD = 360;  // 6 h – Pause fällig, sobald überschritten
  const DAY_TARGET = 480; // 8 h – alles darüber zählt als Überstunden
  const FIRST_START = 450; // 07:30 – Startwert des Rads für den ersten Arbeitsbeginn

  const $ = (s) => document.querySelector(s);
  const root = document.documentElement;

  const ICON = {
    target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".6" fill="currentColor"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/></svg>',
    warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4M12 17h.01"/></svg>'
  };

  const pad = (n) => String(n).padStart(2, '0');
  const hm = (min) => `${Math.floor(min / 60)}:${pad(min % 60)}`;
  const fmtMin = (min) => (min < 60 ? `${min} Min.` : `${hm(min)} h`);
  const toMin = (t) => {
    if (!t) return null;
    const [h, m] = t.split(':').map(Number);
    return Number.isNaN(h) || Number.isNaN(m) ? null : h * 60 + m;
  };

  // Nur für den Moment: nichts wird gespeichert
  let nextId = 1;
  const newEntry = () => ({ id: nextId++, st: '', et: '', goal: null });

  // Wählbare Überstunden-Ziele in Minuten: ±0, 10–50 Min., dann 1 h bis 5 h in Halbstunden-Schritten
  const GOALS = [0, 10, 20, 30, 40, 50, 60, 90, 120, 150, 180, 210, 240, 270, 300];
  const goalLabel = (g) => {
    if (!g) return '±0 (genau 8 h)';
    if (g < 60) return `+${g} Min.`;
    return `+${Math.floor(g / 60)} h${g % 60 ? ` ${g % 60} Min.` : ''}`;
  };
  const state = { autoBreak: true, entries: [newEntry()] };
  let enterId = null;

  /* ---------- Berechnung ---------- */

  // Das Ende muss nach dem Beginn liegen – sonst wird die Arbeitszeit markiert und nicht gezählt
  function timeline() {
    return state.entries.map((en) => {
      const a = toMin(en.st), b = toMin(en.et);
      if (a == null || b == null) return { status: 'incomplete', missStart: a == null, missEnd: b == null, s: a };
      if (b < a) return { status: 'invalid', reason: 'before' };
      if (b === a) return { status: 'invalid', reason: 'same' };
      return { status: 'ok', s: a, e: b, dur: b - a };
    });
  }

  // Eine Arbeitszeit darf nie in eine andere hineinragen – liefert je Eintrag die Indizes der Konflikte
  function overlaps(infos) {
    return infos.map((a, i) => infos.reduce((hits, b, j) => {
      if (i === j || b.status !== 'ok' || a.s == null) return hits;
      const clash = a.status === 'ok' ? a.s < b.e && b.s < a.e : a.s >= b.s && a.s < b.e;
      return clash ? [...hits, j] : hits;
    }, []));
  }

  function calc(infos) {
    const ok = infos.filter((i) => i.status === 'ok').sort((x, y) => x.s - y.s);
    let gross = 0, gaps = 0, overlap = 0, cs = null, ce = null;
    for (const i of ok) {
      if (cs === null) { cs = i.s; ce = i.e; continue; }
      if (i.s >= ce) { gross += ce - cs; gaps += i.s - ce; cs = i.s; ce = i.e; }
      else { overlap += Math.min(i.e, ce) - i.s; ce = Math.max(ce, i.e); }
    }
    if (cs !== null) gross += ce - cs;

    const required = gross > THRESHOLD ? BREAK_MIN : 0;
    const credited = Math.min(gaps, required);
    const due = required - credited;
    const deducted = state.autoBreak ? due : 0;
    return {
      valid: ok.length,
      incomplete: infos.filter((i) => i.status === 'incomplete' && !(i.missStart && i.missEnd)).length,
      invalid: infos.filter((i) => i.status === 'invalid').length,
      gross, gaps, overlap, required, credited, due, deducted,
      net: gross - deducted,
      over: gross - deducted - DAY_TARGET
    };
  }

  /* ---------- Rendering ---------- */
  const entriesEl = $('#entries');

  function timeBtn(en, f) {
    const label = f === 'st' ? 'Beginn' : 'Ende';
    return `<button class="tbtn${en[f] ? '' : ' empty'}" data-f="${f}" aria-label="${label} wählen"><span class="tval">${en[f] || '--:--'}</span>${ICON.clock}</button>`;
  }

  function syncButtons(id) {
    const el = entriesEl.querySelector(`.entry[data-id="${id}"]`);
    const en = state.entries.find((x) => x.id === id);
    if (!el || !en) return;
    ['st', 'et'].forEach((f) => {
      const btn = el.querySelector(`[data-f="${f}"]`);
      btn.classList.toggle('empty', !en[f]);
      btn.querySelector('.tval').textContent = en[f] || '--:--';
    });
  }

  // Arbeitszeiten nach Beginn sortieren (ohne Beginn ans Ende) – gibt zurück, ob sich die Reihenfolge geändert hat
  function sortEntries() {
    const before = state.entries.map((e) => e.id).join();
    const key = (en) => (en.st ? toMin(en.st) : Infinity);
    state.entries = state.entries
      .map((en, i) => ({ en, i }))
      .sort((a, b) => (key(a.en) - key(b.en)) || (a.i - b.i))
      .map((x) => x.en);
    return before !== state.entries.map((e) => e.id).join();
  }

  // Neu rendern; mit animate gleiten die Karten von ihrer alten an die neue Position
  function renderEntries(animate) {
    const oldTops = animate
      ? new Map([...entriesEl.querySelectorAll('.entry')].map((el) => [el.dataset.id, el.getBoundingClientRect().top]))
      : null;
    const n = state.entries.length;
    entriesEl.innerHTML = state.entries.map((en, i) => `
      <div class="entry${en.id === enterId ? ' enter' : ''}" data-id="${en.id}">
        <div class="entry-head">
          <span class="entry-title">Arbeitszeit${n > 1 ? ' ' + (i + 1) : ''}</span>
          <span class="entry-dur" data-slot="dur"></span>
          ${n > 1 ? `<button class="del" aria-label="Arbeitszeit ${i + 1} entfernen">${ICON.trash}</button>` : ''}
        </div>
        <div class="entry-grid">
          <div class="fcol"><span class="lbl">Beginn</span>${timeBtn(en, 'st')}</div>
          <div class="fcol"><span class="lbl">Ende</span>${timeBtn(en, 'et')}</div>
        </div>
        <div class="entry-msg" data-slot="msg"></div>
        <div data-slot="goal"></div>
      </div>${i < n - 1 ? '<div class="gap" data-slot="gap"></div>' : ''}`).join('');
    enterId = null;
    refresh();

    if (!oldTops) return;
    entriesEl.querySelectorAll('.entry').forEach((el) => {
      const old = oldTops.get(el.dataset.id);
      const dy = old == null ? 0 : old - el.getBoundingClientRect().top;
      if (!dy) return;
      el.style.transition = 'none';
      el.style.transform = `translateY(${dy}px)`;
      el.style.position = 'relative';
      el.style.zIndex = '1';
      requestAnimationFrame(() => requestAnimationFrame(() => {
        el.style.transition = 'transform .5s cubic-bezier(.2,.8,.2,1)';
        el.style.transform = '';
        setTimeout(() => { el.style.transition = el.style.position = el.style.zIndex = ''; }, 520);
      }));
    });
  }

  // Nur berechnete Werte aktualisieren – Eingabefelder bleiben unangetastet (Picker & Fokus bleiben erhalten)
  function refresh() {
    const infos = timeline();
    const c = calc(infos);
    const clashes = overlaps(infos);
    c.clash = clashes.some((x) => x.length);
    const label = (j) => {
      const en = state.entries[j];
      return `Arbeitszeit ${j + 1} (${en.st}–${en.et})`;
    };

    [...entriesEl.querySelectorAll('.entry')].forEach((el, i) => {
      const inf = infos[i], clash = clashes[i];
      el.querySelector('[data-slot="dur"]').textContent = inf.status === 'ok' ? `${hm(inf.dur)} h` : '';
      el.classList.toggle('invalid', inf.status === 'invalid' || clash.length > 0);
      const msg = el.querySelector('[data-slot="msg"]');
      let cls = '', text = '';
      if (inf.status === 'invalid') { cls = 'err'; text = inf.reason === 'before' ? 'Das Ende liegt vor dem Beginn – bitte prüfen' : 'Ende und Beginn sind gleich'; }
      else if (clash.length) {
        cls = 'err';
        text = inf.status === 'ok'
          ? `Überschneidet sich mit ${clash.map(label).join(' und ')}`
          : `Beginn liegt innerhalb von ${label(clash[0])}`;
      }
      else if (inf.status === 'incomplete' && inf.missStart && !inf.missEnd) text = 'Beginn fehlt';
      msg.className = `entry-msg ${cls}`;
      msg.textContent = text;

      // Beginn steht, Ende noch offen: nötiges Ende für ein Überstunden-Ziel anbieten
      const open = inf.status === 'incomplete' && !inf.missStart && inf.missEnd && !clash.length;
      el.querySelector('[data-slot="goal"]').innerHTML = open ? goalHTML(i, infos) : '';

      const gapEl = el.nextElementSibling;
      if (gapEl && gapEl.classList.contains('gap')) {
        const g = gapHTML(inf, infos[i + 1], c);
        gapEl.innerHTML = g.html;
        gapEl.classList.toggle('err', g.err);
      }
    });

    renderResult(c);
  }

  // Frühestes Ende der offenen Arbeitszeit i, mit dem netto 8 h + Ziel erreicht werden.
  // Rechnet alle übrigen Arbeitszeiten und die Pausenregel mit ein.
  function goalEnd(i, infos) {
    const en = state.entries[i];
    const s = toMin(en.st);
    const others = infos.filter((x, j) => j !== i);
    const want = DAY_TARGET + en.goal;
    if (calc(others).net >= want) return { done: true };
    for (let e = s + 1; e <= 1439; e++) {
      const c = calc([...others, { status: 'ok', s, e, dur: e - s }]);
      if (c.net < want) continue;
      const hit = infos.findIndex((o, j) => j !== i && o.status === 'ok' && s < o.e && o.s < e);
      return { e, c, hit };
    }
    return null;
  }

  function goalHTML(i, infos) {
    const en = state.entries[i];
    if (en.goal == null) return `<button class="goal-btn">${ICON.target}Ende für Überstunden-Ziel berechnen</button>`;

    const head = `<div class="goal-top"><button class="goal-chip" aria-label="Ziel ändern">Ziel ${goalLabel(en.goal)}${ICON.down}</button><button class="goal-clear" aria-label="Ziel entfernen">${ICON.close}</button></div>`;
    const res = goalEnd(i, infos);
    let body;
    if (!res) body = '<p class="goal-note err">Heute nicht mehr erreichbar – dafür müsstest du über Mitternacht hinaus arbeiten.</p>';
    else if (res.done) body = '<p class="goal-note">Mit den bisherigen Arbeitszeiten schon erreicht.</p>';
    else if (res.hit >= 0) body = `<p class="goal-note err">Nicht möglich – dafür müsstest du in Arbeitszeit ${res.hit + 1} hineinarbeiten.</p>`;
    else {
      const s = toMin(en.st), now = nowMin();
      const parts = [];
      if (now >= s && now < res.e) parts.push(`noch ${fmtMin(res.e - now)}`);
      else if (now >= res.e) parts.push('Uhrzeit schon erreicht');
      else parts.push(`${fmtMin(res.e - s)} ab Beginn`);
      if (res.c.deducted) parts.push(`inkl. ${res.c.deducted} Min. Pause`);
      body = `
        <div class="goal-main"><span>Arbeiten bis</span><strong>${clockStr(res.e)}</strong><span>Uhr</span></div>
        <div class="goal-sub">${parts.join(' · ')}</div>
        <button class="goal-apply" data-t="${clockStr(res.e)}">Als Ende übernehmen</button>`;
    }
    return `<div class="goal-box">${head}${body}</div>`;
  }

  function gapHTML(a, b, c) {
    if (!a || !b || a.status !== 'ok' || b.status !== 'ok') return { html: '', err: false };
    if (b.s >= a.e) {
      const g = b.s - a.e;
      if (!g) return { html: '', err: false };
      const tag = c.required ? '<span class="tag ok">auf Pause angerechnet</span>' : '';
      return { html: `${ICON.pause}<span>Unterbrechung <b>${fmtMin(g)}</b></span>${tag}`, err: false };
    }
    if (b.s < a.e && a.s < b.e) {
      return { html: `${ICON.warn}<span>Überschneidung <b>${fmtMin(Math.min(a.e, b.e) - b.s)}</b></span><span class="tag err">nicht möglich</span>`, err: true };
    }
    return { html: '', err: false };
  }

  function renderResult(c) {
    $('#hero').classList.toggle('empty', !c.valid);
    $('#hero').classList.toggle('error', c.clash);
    $('#hNet').textContent = hm(c.net);
    $('#hSub').textContent = c.valid ? '' : 'Beginn und Ende eintragen';
    $('#hGross').textContent = `${hm(c.gross)} h`;

    const cut = $('#hCut');
    if (c.deducted) { cut.textContent = `−${fmtMin(c.deducted)}`; cut.className = 'stat-v pause'; }
    else if (c.required && !c.due) { cut.textContent = '0 Min.'; cut.className = 'stat-v ok'; }
    else if (c.due) { cut.textContent = 'aus'; cut.className = 'stat-v'; }
    else { cut.textContent = '–'; cut.className = 'stat-v'; }

    // Über 8 h: Überstunden (grün) · unter 8 h: Minusstunden (orange)
    const over = $('#hOver'), overL = $('#hOverL');
    overL.textContent = c.valid && c.over < 0 ? 'Minusstunden' : 'Überstunden';
    if (!c.valid) { over.textContent = '–'; over.className = 'stat-v'; }
    else if (c.over > 0) { over.textContent = `+${hm(c.over)} h`; over.className = 'stat-v ok'; }
    else if (c.over < 0) { over.textContent = `−${hm(-c.over)} h`; over.className = 'stat-v pause'; }
    else { over.textContent = '0:00 h'; over.className = 'stat-v'; }

    // Nur knapp informieren – und nur, wenn die Ruhepause tatsächlich greift
    let html = '';
    if (c.clash) html += '<p class="note err">Arbeitszeiten überschneiden sich – bitte korrigieren.</p>';
    if (c.invalid) html += `<p class="note err">${c.invalid === 1 ? 'Eine Arbeitszeit ist fehlerhaft' : `${c.invalid} Arbeitszeiten sind fehlerhaft`}.</p>`;
    if (c.required) {
      const openMin = c.due - c.deducted;
      const w = (m) => (m / BREAK_MIN) * 100;
      const cls = !c.due ? 'done' : !state.autoBreak ? 'off' : '';
      html += `
        <div class="pbox ${cls}">
          <div class="pbox-head"><span>Ruhepause</span><div class="pbar">${c.credited ? `<i class="ok" style="width:${w(c.credited)}%"></i>` : ''}${c.deducted ? `<i class="cut" style="width:${w(c.deducted)}%"></i>` : ''}${openMin ? `<i class="open" style="width:${w(openMin)}%"></i>` : ''}</div></div>
          <div class="plegend">${c.credited ? `<span><i class="ok"></i>${c.credited} Min. angerechnet</span>` : ''}${c.deducted ? `<span><i class="cut"></i>${c.deducted} Min. abgezogen</span>` : ''}${openMin ? `<span><i class="open"></i>${openMin} Min. offen</span>` : ''}</div>
        </div>`;
    }
    $('#pauseInfo').innerHTML = html;
  }

  /* ---------- Events ---------- */
  entriesEl.addEventListener('click', (e) => {
    const tbtn = e.target.closest('.tbtn');
    if (tbtn) { openPicker(+tbtn.closest('.entry').dataset.id, tbtn.dataset.f, tbtn); return; }
    const entryEl = e.target.closest('.entry');
    if (!entryEl) return;
    const id = +entryEl.dataset.id;
    const en = state.entries.find((x) => x.id === id);

    const goalBtn = e.target.closest('.goal-btn, .goal-chip');
    if (goalBtn) { openGoalPicker(id); return; }
    if (e.target.closest('.goal-clear')) { en.goal = null; refresh(); return; }
    const apply = e.target.closest('.goal-apply');
    if (apply) { en.et = apply.dataset.t; syncButtons(id); refresh(); return; }

    if (!e.target.closest('.del')) return;
    state.entries = state.entries.filter((x) => x.id !== id);
    renderEntries();
  });

  /* ---------- Uhrzeit-Rad ----------
     Beim Ende enthält das Rad nur Uhrzeiten nach dem Beginn – frühere Zeiten sind gar nicht auswählbar. */
  const ITEM = 40;
  const pop = $('#pop'), popCatch = $('#popCatch'), appEl = $('.app');
  let padTimer = null;
  const wheelH = $('#wheelH'), wheelM = $('#wheelM'), wheelG = $('#wheelG');
  let picker = null; // { id, f: 'st' | 'et' | 'goal', min, btn }

  const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
  const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
  const clockStr = (t) => `${pad(Math.floor(t / 60))}:${pad(t % 60)}`;
  const minuteList = (h) => (h === Math.floor(picker.min / 60) ? range(picker.min % 60, 59) : range(0, 59));

  function buildWheel(el, values, selected, label = pad) {
    el._values = values;
    el.innerHTML = `<div class="wpad"></div>${values.map((v) => `<div class="witem" data-v="${v}">${label(v)}</div>`).join('')}<div class="wpad"></div>`;
    setWheel(el, selected, false);
  }
  function setWheel(el, v, smooth) {
    const i = Math.max(0, el._values.indexOf(v));
    el.scrollTo({ top: i * ITEM, behavior: smooth ? 'smooth' : 'auto' });
  }
  function wheelValue(el) {
    const i = Math.min(el._values.length - 1, Math.max(0, Math.round(el.scrollTop / ITEM)));
    return el._values[i];
  }

  function applyPicker() {
    if (!picker) return;
    const en = state.entries.find((x) => x.id === picker.id);
    if (!en) return;
    if (picker.f === 'goal') {
      en.goal = wheelValue(wheelG);
      refresh();
      const res = goalEnd(state.entries.indexOf(en), timeline());
      $('#popHint').textContent = res && res.e && res.hit < 0 ? `Ende ${clockStr(res.e)} Uhr` : '';
      return;
    }
    const t = Math.max(picker.min, wheelValue(wheelH) * 60 + wheelValue(wheelM));
    en[picker.f] = clockStr(t);
    // Wird der Beginn hinter das Ende gelegt, muss das Ende neu gewählt werden
    if (picker.f === 'st' && en.et && toMin(en.et) <= t) en.et = '';
    syncButtons(picker.id);
    refresh();
  }

  function onSettle(el) {
    if (!picker) return;
    if (picker.f !== 'goal' && el === wheelH) {
      const list = minuteList(wheelValue(wheelH));
      if (list[0] !== wheelM._values[0]) buildWheel(wheelM, list, Math.max(wheelValue(wheelM), list[0]));
    }
    applyPicker();
  }

  // Startwert des Rads beim Beginn: 07:30 – bei weiteren Arbeitszeiten 30 Min. nach dem letzten Ende
  function defaultStart(id) {
    const ends = state.entries
      .filter((x) => x.id !== id && x.st && x.et && toMin(x.et) > toMin(x.st))
      .map((x) => toMin(x.et));
    return ends.length ? Math.max(...ends) + 30 : FIRST_START;
  }

  function openPicker(id, f, btn) {
    const en = state.entries.find((x) => x.id === id);
    if (!en) return;
    const min = f === 'et' && en.st ? toMin(en.st) + 1 : 0;
    if (min > 1439) return;
    picker = { id, f, min, btn };
    const cur = Math.min(1439, Math.max(min, toMin(en[f]) ?? (f === 'et' ? nowMin() : defaultStart(id))));
    const h = Math.floor(cur / 60);

    clearTimeout(padTimer);
    pop.classList.remove('goal');
    $('#popTitle').textContent = f === 'st' ? 'Beginn' : 'Ende';
    $('#popHint').textContent = min ? `ab ${clockStr(min)}` : '';
    btn.classList.add('active');
    appEl.classList.add('picking');
    pop.classList.add('show');
    popCatch.classList.add('show');
    buildWheel(wheelH, range(Math.floor(min / 60), 23), h);
    buildWheel(wheelM, minuteList(h), cur % 60);
    applyPicker();
    wheelH.focus({ preventScroll: true });
    keepAbovePanel(id);
  }

  // Dasselbe Glas-Panel, aber mit einem Rad für das Überstunden-Ziel
  function openGoalPicker(id) {
    const en = state.entries.find((x) => x.id === id);
    if (!en) return;
    picker = { id, f: 'goal', min: 0, btn: null };
    clearTimeout(padTimer);
    pop.classList.add('goal');
    $('#popTitle').textContent = 'Überstunden-Ziel';
    appEl.classList.add('picking');
    pop.classList.add('show');
    popCatch.classList.add('show');
    buildWheel(wheelG, GOALS, en.goal ?? 0, goalLabel);
    applyPicker();
    wheelG.focus({ preventScroll: true });
    keepAbovePanel(id);
  }

  // Das Panel sitzt unten in Daumenreichweite – die bearbeitete Arbeitszeit wird darüber sichtbar gehalten
  function keepAbovePanel(id) {
    const entryEl = entriesEl.querySelector(`.entry[data-id="${id}"]`);
    if (!entryEl) return;
    const panelTop = window.innerHeight - parseFloat(getComputedStyle(pop).bottom) - pop.offsetHeight;
    const overlap = entryEl.getBoundingClientRect().bottom - (panelTop - 14);
    if (overlap > 0) window.scrollBy({ top: overlap, behavior: 'smooth' });
  }

  function closePicker() {
    if (!picker) return;
    clearTimeout(wheelH._t); clearTimeout(wheelM._t); clearTimeout(wheelG._t);
    if (picker.f === 'goal') applyPicker(); else onSettle(wheelH);
    const { id, f, btn } = picker;
    picker = null;
    pop.classList.remove('show');
    popCatch.classList.remove('show');
    if (btn) btn.classList.remove('active');
    // Zusätzlichen Platz unten erst entfernen, nachdem ggf. sanft zurückgescrollt wurde
    appEl.classList.remove('picking');
    const excess = window.scrollY + window.innerHeight - document.documentElement.scrollHeight;
    if (excess > 0) {
      appEl.classList.add('picking');
      window.scrollBy({ top: -excess, behavior: 'smooth' });
      padTimer = setTimeout(() => appEl.classList.remove('picking'), 450);
    }
    // Nach Uhrzeit sortieren, damit Reihenfolge und Unterbrechungen dem Tagesablauf folgen
    if (f === 'st' && sortEntries()) {
      renderEntries(true);
      const again = entriesEl.querySelector(`.entry[data-id="${id}"] [data-f="${f}"]`);
      if (again) again.focus({ preventScroll: true });
    } else if (btn) {
      btn.focus({ preventScroll: true });
    }
  }

  // Die Restzeit („noch …“) läuft mit der Uhr mit
  setInterval(() => {
    if (!picker && state.entries.some((x) => x.goal != null && x.st && !x.et)) refresh();
  }, 20000);

  [wheelH, wheelM, wheelG].forEach((el) => {
    el.addEventListener('scroll', () => {
      clearTimeout(el._t);
      el._t = setTimeout(() => onSettle(el), 110);
    }, { passive: true });
    el.addEventListener('click', (e) => {
      const it = e.target.closest('.witem');
      if (it) setWheel(el, +it.dataset.v, true);
    });
    el.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      e.preventDefault();
      const i = el._values.indexOf(wheelValue(el)) + (e.key === 'ArrowDown' ? 1 : -1);
      if (i >= 0 && i < el._values.length) setWheel(el, el._values[i], true);
    });
  });

  $('#popNow').addEventListener('click', () => {
    if (!picker || picker.f === 'goal') return;
    const t = Math.max(picker.min, nowMin());
    const h = Math.floor(t / 60);
    setWheel(wheelH, h, false);
    buildWheel(wheelM, minuteList(h), t % 60);
    applyPicker();
  });
  $('#popDone').addEventListener('click', closePicker);
  popCatch.addEventListener('click', closePicker);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePicker(); });
  let lastWidth = window.innerWidth;
  window.addEventListener('resize', () => {
    if (window.innerWidth !== lastWidth) { lastWidth = window.innerWidth; closePicker(); }
  });

  // Neue Arbeitszeit ins untere Drittel des Bildschirms holen
  $('#addBtn').addEventListener('click', () => {
    const en = newEntry();
    state.entries.push(en);
    enterId = en.id;
    renderEntries();
    const el = entriesEl.querySelector(`.entry[data-id="${en.id}"]`);
    if (!el) return;
    requestAnimationFrame(() => {
      const r = el.getBoundingClientRect();
      const target = window.scrollY + r.top + r.height / 2 - window.innerHeight * 0.68;
      window.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
    });
  });

  $('#resetBtn').addEventListener('click', () => {
    state.entries = [newEntry()];
    renderEntries();
  });

  const autoBreakEl = $('#autoBreak');
  autoBreakEl.addEventListener('change', () => { state.autoBreak = autoBreakEl.checked; refresh(); });

  /* ---------- Theme (nur die Darstellungswahl wird gemerkt) ---------- */
  const isDark = () => root.getAttribute('data-theme') === 'dark';
  function syncTheme() {
    $('#themeColor').setAttribute('content', isDark() ? '#000000' : '#F2F2F7');
    $('#themeBtn').setAttribute('aria-label', isDark() ? 'Helles Design aktivieren' : 'Dunkles Design aktivieren');
  }
  $('#themeBtn').addEventListener('click', () => {
    const next = isDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('arbeitszeit.theme', next); } catch (e) {}
    syncTheme();
  });

  /* ---------- Begrüßung & Spruch – passend zur Tageszeit ----------
     morgens 5–11 Uhr · mittags 11–15 Uhr · Feierabend-Sprüche erst ab 15 Uhr · nachts ab 22 Uhr */

  const HEARTS = ['❤️', '🧡', '💛', '💚', '💙', '💜', '🤍', '🩷', '💖', '💕'];

    morning: ['Guten Morgen', 'Schönen guten Morgen', 'Morgen, Sonnenschein', 'Auf einen guten Start', 'Hallo, neuer Tag', 'Kaffee an, los geht’s', 'Einen wunderschönen Morgen'],
    midday: ['Mahlzeit', 'Schöne Mittagszeit', 'Halbzeit – du machst das toll', 'Hallo zur Mittagszeit', 'Guten Appetit nachher'],

    evening: ['Guten Abend', 'Schönen Feierabend', 'Zeit für Feierabend', 'Du hast heute genug getan', 'Genieß deinen Abend'],
    night: ['Bald ist Schlafenszeit', 'Noch wach?', 'Hallo, Nachteule', 'Schlaf nachher schön', 'Gute Nacht bald'],
    any: ['Hallo du', 'Schön, dass du da bist', 'Du bist großartig', 'Hey, Superstar', 'Hallo, Lieblingsmensch']

    const h = hour();
    const slot = h >= 5 && h < 11 ? 'morning' : h >= 11 && h < 15 ? 'midday' : h >= 15 && h < 18 ? 'afternoon' : h >= 18 && h < 22 ? 'evening' : 'night';
    return `${pick([...GREETINGS[slot], ...GREETINGS[slot], ...GREETINGS.any])} ${pick(HEARTS)}`;
  }

  const quoteEl = $('#quote');
  let quoteText = '';
  let funnyNext = Math.random() < 0.5;
  function showQuote() {
    const h = hour();
    const tags = h >= 5 && h < 12 ? ['any', 'am', 'day'] : h >= 5 && h < 15 ? ['any', 'day'] : ['any', 'pm'];
    const pool = (funnyNext ? FUNNY : QUOTES).filter(([t, q]) => tags.includes(t) && q !== quoteText);
    funnyNext = !funnyNext;
    quoteText = pick(pool)[1];
    quoteEl.textContent = quoteText;
  }
  // Antippen zeigt einen neuen Spruch
  quoteEl.addEventListener('click', () => {
    showQuote();
    quoteEl.classList.remove('swap');
    void quoteEl.offsetWidth;
    quoteEl.classList.add('swap');
  });

  syncTheme();
